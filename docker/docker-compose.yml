services:
  postgres:
    image: postgres:16-alpine
    container_name: zona-fluxus-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zona_fluxus}
      POSTGRES_USER: ${POSTGRES_USER:-zona_fluxus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PA
      SSWORD:-zona_fluxus_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zona_fluxus_user} -d ${POSTGRES_DB:-zona_fluxus}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    driver: local